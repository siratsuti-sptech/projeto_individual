<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>旅人 | Tabito | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/Emblema Tabito_ Jornada Japonesa.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
  <!--header inicio-->
  <div class="header">
    <div class="container">
      <a href="index.html" class="marca">
        <img src="assets/imgs/logo-emblema.png" alt="Logo do Tabito">
      <h1 class="titulo">旅人 | Tabito</h1>
      <ul class="navbar">
        <li>
          <a href="index.html">Inicial</a>
        </li>
     
        <li>|</li>
        <li>
          <a href="login.html">Login</a>
        </li>
        <li>|</li>
        <li class="agora">
          <a href="#">Cadastro</a>
        </li>
      </ul>
    </div>
  </div>
  <!--header fim-->

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Iniciar Jornada</h2>
        
        <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->
         
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
        
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

  <!--footer inicio-->
  <div class="footer">
    <div class="container">
      <h4>Preparado para voar?</h4>
      <div class="footer-acoes">
        <a href="login.html" class="btn">Já tenho conta</a>
    
  </div>
    </div>
  </div>
  <!--footer fim-->
</body>

</html>

<script>
    // Verificando se há algum campo em branco
    function cadastrar() {
  var nomeVar = nome_input.value;
  var emailVar = email_input.value;
  var senhaVar = senha_input.value;
  var confirmacaoSenhaVar = confirmacao_senha_input.value;

  if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {
    mostrarMensagem("Preencha todos os campos.");
    return false;
  }
  if (emailVar.indexOf("@") == -1 || emailVar.indexOf(".") == -1) {
    mostrarMensagem("Digite um e-mail válido.");
    return false;
  }
  if (senhaVar.length < 8) {
    mostrarMensagem("A senha precisa ter pelo menos 8 caracteres.");
    return false;
  }
  if (senhaVar != confirmacaoSenhaVar) {
    mostrarMensagem("A confirmação não confere com a senha.");
    return false;
  }

  aguardar();

  fetch("/usuarios/cadastrar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      nomeServer: nomeVar,
      emailServer: emailVar,
      senhaServer: senhaVar
    })
  })
    .then(function (resposta) {
      if (resposta.ok) {
        mostrarMensagem("Cadastro realizado com sucesso! Redirecionando para o login...");
        setTimeout(function () {
          window.location = "login.html";
        }, 2000);
      } else {
        // mostra o texto que a API mandou (ex.: "Este e-mail já está cadastrado.")
        resposta.text().then(function (texto) {
          mostrarMensagem(texto || "Houve um erro ao tentar realizar o cadastro.");
        });
      }
      finalizarAguardar();
    })
    .catch(function (erro) {
      console.log(erro);
      mostrarMensagem("Não foi possível conectar ao servidor.");
      finalizarAguardar();
    });

  return false;
}

function mostrarMensagem(texto) {
  cardErro.style.display = "block";
  mensagem_erro.innerHTML = texto;
  setTimeout(sumirMensagem, 5000);
}

function sumirMensagem() {
  cardErro.style.display = "none";
}
  
</script>
